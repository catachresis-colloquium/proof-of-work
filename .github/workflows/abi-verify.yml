#
# abi-verify.yml — machine-checks the Rust↔SPARK ABI seam.
#
# The seam (src/abi/ProofOfWork/ABI/{Types,Foreign,Invariants}.idr) states
# the consensus-/correctness-critical invariants I1–I7 (see PROOF-NEEDS.md).
# Some are DISCHARGED proofs (e.g. Invariants.builtinPackMonotone,
# decNonDecreasing); the rest are explicit erased OWED obligations or the
# I6 cryptographic-hardness ASSUMPTION.
#
# This gate exists so the discharged proofs cannot silently regress and an
# OWED postulate cannot quietly become a `believe_me`. Mirrors the
# stapeln cerro-torre Idris2 job (snazzybucket/idris2 container, same image
# the estate already proves against). HARD GATE.

name: ABI Seam Verification

on:
  pull_request:
    paths:
      - 'src/abi/**'
      - '.github/workflows/abi-verify.yml'
  push:
    branches: [main]
    paths:
      - 'src/abi/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  idris2-abi:
    name: Idris2 ABI seam (proof-of-work-abi.ipkg)
    runs-on: ubuntu-latest
    container:
      image: snazzybucket/idris2:latest  # estate-standard Idris2 image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: No holes or escape hatches in the seam
        working-directory: src/abi
        run: |
          set -eu
          # The container runs steps with POSIX sh, so no pipefail here.
          # Idris2 accepts a ?hole and these escape hatches even with
          # totality on, so the build alone would not catch them.
          # Idris2 honours a partial or covering modifier after any other
          # modifier (export, %inline, ...) or alone on its line, so any use of
          # either word on a code line fails. A hole name may start with an
          # uppercase or a non-ASCII letter (?Foo), so a ? before a letter, an
          # underscore or any non-ASCII byte fails. Whole-line -- and |||
          # comments are skipped; a trailing or block comment or a string
          # naming either word fails too, so reword it. %extern declares a
          # value whose body comes from outside, so it could stand in for a
          # proof; the seam binds C through %foreign, which stays allowed.
          pattern='(^|[^A-Za-z0-9_'"'"'])\?([A-Za-z_]|[^ -~[:space:]])|believe_me|assert_total|assert_smaller|idris_crash|%extern|(^|[^A-Za-z0-9_'"'"'.])(partial|covering)([^A-Za-z0-9_'"'"']|$)'
          hits=$(find . -name '*.idr' -not -path './build/*' -exec env LC_ALL=C grep -HnE "$pattern" {} + \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(--|\|\|\|)' || true)
          if [ -n "$hits" ]; then
            echo "::error::Holes or escape hatches in the ABI seam:"
            echo "$hits"
            exit 1
          fi

      - name: Build (typecheck) the ABI seam
        working-directory: src/abi
        run: |
          set -eu
          idris2 --version
          # Totality comes only from opts in the .ipkg, and the flag must sit
          # inside the quoted value: opts = "" -- --total sets no options.
          # Exactly one opts/options line is allowed: a later one replaces the
          # earlier, so opts = "--total" then options = "" sets no options.
          decls=$(grep -cE '^[[:space:]]*(opts|options)[[:space:]]*=' proof-of-work-abi.ipkg || true)
          if [ "$decls" != 1 ] \
            || ! grep -Eq '^[[:space:]]*(opts|options)[[:space:]]*=[[:space:]]*"[^"]*--total[^"]*"' proof-of-work-abi.ipkg; then
            echo "::error::proof-of-work-abi.ipkg must have exactly one opts line, set to opts = \"--total\""
            exit 1
          fi
          # --build typechecks every module in the .ipkg in dependency
          # order, with totality required by `opts = "--total"` in the
          # .ipkg. An ill-typed lemma or a non-total definition fails
          # here; holes and escape hatches are refused by the step above.
          # A declaration with no definition (the erased OWED postulates,
          # the I6 and I7 assumptions) is accepted by Idris2 and does NOT
          # fail the build. PROOF-NEEDS.adoc lists each one.
          idris2 --build proof-of-work-abi.ipkg
